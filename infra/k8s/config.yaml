apiVersion: v1
kind: ConfigMap
metadata:
  name: interviewai-config
  namespace: interviewai
data:
  NODE_ENV: 'production'
  API_PORT: '4000'
  AI_DEFAULT_PROVIDER: 'openai'
  AI_DEFAULT_MODEL: 'gpt-4o-mini'
  LOG_LEVEL: 'info'
  WEB_BASE_URL: 'https://app.interviewai.example.com'
---
# Secrets are placeholders. In production these are populated by an External
# Secrets Operator sourcing from AWS Secrets Manager — never committed.
apiVersion: v1
kind: Secret
metadata:
  name: interviewai-secrets
  namespace: interviewai
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://user:pass@rds-primary:5432/interviewai'
  DATABASE_REPLICA_URL: 'postgresql://user:pass@rds-replica:5432/interviewai'
  REDIS_URL: 'redis://redis-cluster:6379'
  JWT_ACCESS_SECRET: 'REPLACE_ME'
  JWT_REFRESH_SECRET: 'REPLACE_ME'
  PROCTOR_WEBHOOK_SECRET: 'REPLACE_ME'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  GEMINI_API_KEY: ''
