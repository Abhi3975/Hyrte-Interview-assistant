<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>InterviewAI Agent</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0a0e17; color: #e6ebf5; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { font-size: 12px; color: #9aa4b8; margin: 4px 0; }
      #log { margin-top: 10px; font-size: 11px; color: #f59e0b; max-height: 80px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> Monitoring active</h1>
    <p>This session is proctored. Your screen and environment are being monitored for integrity.</p>
    <p id="session">Session: —</p>
    <div id="log"></div>
    <script>
      window.agent?.getStatus().then((s) => {
        document.getElementById('session').textContent = 'Session: ' + (s.session || 'not started');
      });
      window.agent?.onDetection((d) => {
        const el = document.getElementById('log');
        el.textContent = '⚠ ' + d.type + ' (' + d.processName + ')\n' + el.textContent;
      });
    </script>
  </body>
</html>
