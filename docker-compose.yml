# Local development stack. `docker compose up -d` boots the full platform:
# Postgres, Redis, MinIO (S3), Judge0 (code execution), API, and Web.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interviewai
      POSTGRES_PASSWORD: interviewai
      POSTGRES_DB: interviewai
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interviewai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']

  # Kafka (KRaft mode, no Zookeeper) — event backbone for proctoring/analytics.
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports: ['9092:9092']

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # Self-hosted code execution sandbox for the DSA module.
  judge0:
    image: judge0/judge0:1.13.1
    privileged: true
    ports: ['2358:2358']
    depends_on: [postgres, redis]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://interviewai:interviewai@postgres:5432/interviewai?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CODE_EXEC_URL: http://judge0:2358
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
    ports: ['3000:3000']
    depends_on: [api]

  # Vision/audio ML inference — emits signed proctor events to the API.
  inference:
    build:
      context: apps/inference-service
      dockerfile: Dockerfile
    environment:
      INTERVIEWAI_API: http://api:4000
      PROCTOR_WEBHOOK_SECRET: change-me-proctor-secret
    ports: ['8000:8000']
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
