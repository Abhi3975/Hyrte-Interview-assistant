name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality gates ──
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interviewai
          POSTGRES_PASSWORD: interviewai
          POSTGRES_DB: interviewai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U interviewai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://interviewai:interviewai@localhost:5432/interviewai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ── Security scanning (SAST + deps + secrets) ──
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency & SAST scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ── Build & push images ──
  docker:
    needs: [lint-test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Progressive delivery ──
  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EKS (staging)
        run: |
          echo "aws eks update-kubeconfig --name interviewai-staging"
          echo "kubectl -n interviewai set image deploy/api api=ghcr.io/${{ github.repository }}/api:${{ github.sha }}"
          echo "kubectl -n interviewai set image deploy/web web=ghcr.io/${{ github.repository }}/web:${{ github.sha }}"
          echo "kubectl -n interviewai rollout status deploy/api"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # requires manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EKS (production, rolling)
        run: |
          echo "aws eks update-kubeconfig --name interviewai-prod"
          echo "kubectl -n interviewai set image deploy/api api=ghcr.io/${{ github.repository }}/api:${{ github.sha }}"
          echo "kubectl -n interviewai rollout status deploy/api --timeout=300s"
